name: Bug 报告
description: 报告 Bug 帮助改进 PriceLens
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽可能详细地填写以下信息，帮助我们快速定位问题。
  - type: dropdown
    id: platform
    attributes:
      label: 客户端
      options:
        - Android
        - Windows
      multiple: true
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: 系统版本
      placeholder: "例: Android 14 / Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: 目标 App 版本
      placeholder: "例: 京东 13.2.0 / 淘宝 10.38.0"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请详细描述复现步骤
      placeholder: |
        1. 打开京东 App
        2. 进入某商品详情页
        3. 观察 PriceLens 浮窗
        4. 实际行为: 浮窗未显示 / 价格错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生的正确行为
      placeholder: 浮窗应自动弹出并显示正确价格
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 截图/日志
      description: 请附上 Logcat、控制台日志、Layout Inspector 截图等
      render: text
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 其他有助于解决的信息
      placeholder: 可能原因、已尝试的排查方向等
    validations:
      required: false