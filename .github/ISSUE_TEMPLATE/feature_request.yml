name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出新功能建议！请描述你希望看到的功能及其价值。
  - type: dropdown
    id: platform
    attributes:
      label: 目标客户端
      options:
        - Android
        - Windows
        - 双端通用
      multiple: true
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题
      description: 这个功能要解决什么痛点？用户场景是什么？
      placeholder: "例: 目前无法在拼多多百亿补贴页面识别价格，用户无法比价"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你心目中的实现方案（可选，我们会评估最佳技术路线）
      placeholder: "新增 PddCrawler 解析百亿补贴专用 DOM 结构..."
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 有没有其他方式实现类似效果？
      placeholder: "暂无"
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - "低 (Nice to have)"
        - "中 (重要但不紧急)"
        - "高 (阻塞核心流程)"
      default: 1
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 相关链接、竞品参考、设计草图等
      placeholder: "无"
    validations:
      required: false