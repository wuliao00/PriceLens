name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  # 手动跑一次：让"找券真实流水线打分"那道硬门禁能在**非 main 分支**上被真正执行过。
  # 它原来只在 main/develop 的 push 与 PR 上触发，所以新加的那一步在合并进 main 之前
  # 从来没有在任何真实 runner 上跑过一次 —— 而"本地 dry-run 绿"和"runner 上绿"不是一回事
  # （runner 的 python3/JDK/缓存与本机不同，缺文件时的失败形状也只有真跑才看得到）。
  # 安全性：会改外部状态的 job 全都钉在 `github.ref == 'refs/heads/main' && event_name == 'push'`
  # （update-manifest / desktop 发布）与 `event_name == 'release'`（release 产物）上，
  # 手动 dispatch 只会跑 android-build 与 desktop 的构建测试，不推镜像、不发版。
  # 故意**不声明 inputs**：dispatch 输入是事件字段，一旦哪天被 echo 进 run: 就成了注入面，
  # 这里没有需要它传参的理由。
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  # 与 gradle/wrapper/gradle-wrapper.properties 保持一致（8.11）
  GRADLE_VERSION: '8.11'

jobs:
  # ========== Android 构建与测试 ==========
  android-build:
    name: Android Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 只暴露"密钥在不在"这个布尔值，不暴露密钥本身（密钥仍只注入到需要它的那一步）。
      # Actions 的**步骤级 if 里用不了 secrets 上下文**（会报 Unrecognized named-value: 'secrets'，
      # 整条流水线 0 秒失败），所以存在性判定必须经 job 级 env 中转 —— 与 update-manifest job
      # 处理 GITEE_MIRROR_TOKEN 的同一套路。
      HAS_RELEASE_KEYS: ${{ secrets.PRICLENS_STORE_B64 != '' }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史用于版本号生成
      
      - name: 设置 JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      
      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 35
          ndk-version: r26c
      
      - name: 验证 Gradle Wrapper
        run: ./gradlew --version
      
      # 评审修复：拆回独立步骤、去掉 --continue，任一失败即阻断后续步骤。
      # ktlint 门禁（org.jlleitschuh.gradle.ktlint 12.1.2，规则基线见根目录 .editorconfig；
      # accessibility/ 与 data/remote/ 排除在风格检查外）。
      - name: 单元测试
        run: ./gradlew test --no-daemon

      # 找券**真实流水线**的回归门禁。上面那步里的 `CouponGoldenPredictionTest` 已经把 golden
      # 过了一遍真流水线并导出 `app/build/coupon-predictions.jsonl`，这里拿它对着 baseline 打分：
      # 任一 source 的 F1 相对基线回退 > 0.01 就红。
      # 两个文件缺任何一个都**直接红**，不写 `if: 文件存在才跑` —— skipped 的步骤看起来和绿的一样，
      # 但它其实是"什么都没测"（这一步在 2026-10-05 之前就是这么静默地从来没跑过）。
      #
      # ⚠ 但"缺文件"有两种成因，必须分开处理（2026-10-07 发 2.8.0.2 时踩到）：
      #   上面那步 `./gradlew test` 命中 Gradle **构建缓存**时，`:app:testDebugUnitTest FROM-CACHE`
      #   只会恢复该任务**已声明的输出**，而 `coupon-predictions.jsonl` 是测试自己写进 build 目录的
      #   副产物、没被声明 ⇒ 缓存命中的那一轮它根本不存在。表现是：冷缓存的 run 绿、暖缓存的 run 红，
      #   而代码一模一样（release 事件那次 8m53s 绿、紧接着的 main push 那次 59s 红）。
      #   所以缺文件时**先把那个测试真跑一遍**再判，而不是直接红，也不是跳过：
      #   `--rerun` 让该任务无视 up-to-date 与缓存强制执行，门禁重新变成"测过的"。
      - name: 找券真实流水线打分（相对 baseline 回退 > 0.01 即红）
        run: |
          mkdir -p reports
          if [ ! -f app/build/coupon-predictions.jsonl ]; then
            echo "::notice::预测文件不在（多半是 test 任务 FROM-CACHE，未声明输出没被恢复），强制执行一次"
            ./gradlew :app:testDebugUnitTest --tests "*CouponGoldenPredictionTest*" --rerun --no-daemon
          fi
          test -f app/build/coupon-predictions.jsonl || { echo "::error::预测文件没生成：CouponGoldenPredictionTest 没跑或输出路径漂了"; exit 1; }
          test -f tools/golden/baseline.json || { echo "::error::没有 tools/golden/baseline.json，门禁无基线可比（生成方式见 docs/DEVELOPMENT.md）"; exit 1; }
          python3 tools/eval_coupons.py \
            tools/golden/coupons.jsonl app/build/coupon-predictions.jsonl tools/golden/baseline.json \
            --tolerance 0.01 --report reports/coupon-real.txt

      - name: 上传找券预测与报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupon-real-predictions
          path: |
            app/build/coupon-predictions.jsonl
            reports/
          if-no-files-found: warn

      - name: ktlint 风格门禁
        run: ./gradlew ktlintCheck --no-daemon

      - name: 构建验证（Debug APK）
        run: ./gradlew :app:assembleDebug --no-daemon
      
      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      
      - name: 构建 Release APK (仅 Release 事件)
        if: github.event_name == 'release' && env.HAS_RELEASE_KEYS == 'true'
        env:
          PRICLENS_STORE_B64: ${{ secrets.PRICLENS_STORE_B64 }}
          PRICLENS_STORE_PASSWORD: ${{ secrets.PRICLENS_STORE_PASSWORD }}
          PRICLENS_KEY_ALIAS: ${{ secrets.PRICLENS_KEY_ALIAS }}
          PRICLENS_KEY_PASSWORD: ${{ secrets.PRICLENS_KEY_PASSWORD }}
        run: |
          # 密钥二进制经 base64 secret 传入 runner 落真实文件（旧版把"路径字符串"当文件写进 local.properties，runner 上根本没有那个文件）
          base64 -d <<< "$PRICLENS_STORE_B64" > "$RUNNER_TEMP/pricelens-release.keystore"
          {
            echo "PRICLENS_STORE_FILE=$RUNNER_TEMP/pricelens-release.keystore"
            echo "PRICLENS_STORE_PASSWORD=$PRICLENS_STORE_PASSWORD"
            echo "PRICLENS_KEY_ALIAS=$PRICLENS_KEY_ALIAS"
            echo "PRICLENS_KEY_PASSWORD=$PRICLENS_KEY_PASSWORD"
          } >> local.properties
          ./gradlew :app:assembleRelease --no-daemon
      
      - name: 说明：Release APK 由本机出包（CI 无签名密钥）
        if: github.event_name == 'release' && env.HAS_RELEASE_KEYS != 'true'
        run: |
          echo "::notice::仓库未配置 PRICLENS_STORE_FILE 等签名密钥，CI 不产出 release 包。"
          echo "正式包由本机 assembleRelease + debug.keystore 签名后放到 dist 孤儿分支与 GitHub Release；"
          echo "流程见 docs/DEVELOPMENT.md 的「本机构建环境」与 5.1/5.2 节。"

      - name: 上传 Release APK (仅 Release 事件)
        if: github.event_name == 'release' && env.HAS_RELEASE_KEYS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  # ========== 更新清单校验 + Gitee 镜像（v2.6.0 应用内更新闸门的数据源） ==========
  # 独立 job：不被 android-build/desktop-build 依赖，缺密钥时整步优雅跳过。
  # 校验部分只做"清单是不是自洽的 JSON"，不改动任何构建产物。
  update-manifest:
    name: Update Manifest & Gitee Mirror
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 只在 main 分支 push 时跑（PR 拿不到 secrets，也不需要镜像同步）
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
    # 镜像推送的凭据在这里落地（步骤级 if 读不到 secrets，只能读 env）
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_MIRROR_TOKEN }}
      GITEE_USER: ${{ secrets.GITEE_MIRROR_USERNAME }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          # 默认 fetch-depth: 1 是浅克隆，推 Gitee 会被拒（shallow update not allowed），
          # 而且校验清单也不需要历史——但为了让镜像步可用，这里取完整历史。
          fetch-depth: 0

      - name: 校验 update.json 自洽性
        run: |
          python3 - <<'PY'
          import json, re, sys, datetime

          with open("update.json", encoding="utf-8") as f:
              m = json.load(f)

          errors = []
          warns = []

          if m.get("schemaVersion") != 1:
              errors.append("schemaVersion 必须是 1（客户端只认 1）")
          latest = m.get("latest", {})
          code, min_supported, force_below = (
              latest.get("versionCode"), m.get("minSupportedVersionCode"), m.get("forceBelow")
          )
          if not all(isinstance(x, int) for x in (code, min_supported, force_below)):
              errors.append("latest.versionCode / minSupportedVersionCode / forceBelow 必须是整数")
          else:
              if code < min_supported:
                  errors.append("latest.versionCode 不能低于 minSupportedVersionCode（否则无人能升级）")
              if force_below > min_supported:
                  errors.append("forceBelow 应 <= minSupportedVersionCode，否则强提示层永远被阻断层吃掉")
          urls = m.get("apkUrls") or []
          if not urls:
              errors.append("apkUrls 不能为空（客户端要求至少一个下载目标）")
          for u in urls:
              if not str(u.get("url", "")).startswith("https://"):
                  errors.append(f"apkUrls 必须走 https: {u.get('url')}")
              if u.get("kind") not in ("apk", "page"):
                  errors.append(f"apkUrls.kind 只能是 apk 或 page: {u.get('kind')}")
          if not any(u.get("kind") == "apk" for u in urls):
              warns.append("没有 kind=apk 的直链，应用内下载会退化为打开下载页")
          percent = m.get("rolloutPercent", 100)
          if not (0 <= percent <= 100):
              errors.append("rolloutPercent 必须在 0..100")
          generated = m.get("generatedAt", "")
          try:
              ts = datetime.datetime.fromisoformat(str(generated).replace("Z", "+00:00"))
              if ts.tzinfo is None:
                  ts = ts.replace(tzinfo=datetime.timezone.utc)
              age_days = (datetime.datetime.now(datetime.timezone.utc) - ts).days
              if age_days > 30:
                  warns.append(f"generatedAt 已 {age_days} 天旧，客户端会按陈旧清单静默不阻断")
          except Exception:
              errors.append(f"generatedAt 无法解析: {generated}")
          sha = m.get("sha256", "")
          if not re.fullmatch(r"[0-9a-f]{64}", sha or ""):
              warns.append("sha256 不是 64 位十六进制，应用内下载将降级为打开下载页（发布时请回填真实值）")

          for e in errors:
              print("::error::" + e)
          for w in warns:
              print("::warning::" + w)
          if errors:
              sys.exit(1)
          print("update.json OK: latest=%s min=%s rollout=%s%%" % (code, min_supported, percent))
          PY

      # 缺 GITEE_MIRROR_TOKEN 时不执行、不报错；Gitee 抖动也只告警不阻断流水线
      # ⚠ 步骤级 if 里**不能**用 secrets 上下文（Actions 会报
      #   "Unrecognized named-value: 'secrets'"，整条流水线 0 秒失败且 run 名退化成文件路径）。
      #   所以密钥先在本 job 的 env 里落地，if 只读 env。
      - name: 推送 Gitee 公开镜像（更新源）
        if: ${{ env.GITEE_TOKEN != '' }}
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote add gitee "https://${GITEE_USER:-wuliao11541}:${GITEE_TOKEN}@gitee.com/${GITEE_USER:-wuliao11541}/PriceLens.git"
          # 不用 --force：GitHub 与 Gitee 的 main 是同一条历史，正常推送就是快进。
          # 也不设 fetch-depth: 0 的话 checkout 是浅克隆，推完整历史会被 Gitee 以
          # "shallow update not allowed" 拒掉——所以上面 Checkout 代码必须带 fetch-depth: 0。
          git push gitee HEAD:refs/heads/main
          echo "已推送 Gitee 镜像，客户端清单地址：https://gitee.com/${GITEE_USER:-wuliao11541}/PriceLens/raw/main/update.json"

      - name: 缺少镜像密钥时跳过
        if: ${{ env.GITEE_TOKEN == '' }}
        run: echo "::notice::未配置 GITEE_MIRROR_TOKEN，跳过 Gitee 镜像推送（清单校验已完成）。维护机上的 SSH 通道（git remote add gitee git@gitee.com:wuliao11541/PriceLens.git）是已验证可用的替代路径。"

  # ========== Desktop 构建与测试 ==========
  desktop-build:
    name: Desktop Build & Test
    runs-on: windows-latest
    timeout-minutes: 30
    
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      
      - name: 安装依赖
        run: npm ci
      
      - name: 代码风格检查
        run: npm run lint
      
      - name: 单元测试
        run: npm test --if-present
      
      - name: 构建分发包
        run: npm run build
      
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: desktop/dist/*.zip
          retention-days: 7

  # ========== 文档部署 ==========
  docs-deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: [android-build, desktop-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 设置 Pages
        uses: actions/configure-pages@v6
      
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          # 仅上传文档目录，避免把整仓源码发布到 Pages
          path: 'docs'
      
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ========== Release 发布 ==========
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [android-build, desktop-build]
    if: github.event_name == 'release'
    env:
      # 与 android-build 同一套存在性判定：没签名密钥时下载/重命名步骤一并跳过（否则 release job 必红）
      HAS_RELEASE_KEYS: ${{ secrets.PRICLENS_STORE_B64 != '' }}
    permissions:
      contents: write
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 下载 Android Release APK
        if: env.HAS_RELEASE_KEYS == 'true'
        uses: actions/download-artifact@v8
        with:
          name: app-release-apk
          path: release-assets/
      
      - name: 下载 Desktop 分发包
        uses: actions/download-artifact@v8
        with:
          name: desktop-dist
          path: release-assets/
      
      - name: 重命名 Android APK
        if: env.HAS_RELEASE_KEYS == 'true'
        env:
          # 事件字段走 env 传进 shell，不直接内插进 `run:`：tag 名是事件可控字段，
          # 写死在命令行里就是注入面（本仓库为 workflow_dispatch 的 inputs 立过同一条规矩）。
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # 目标名必须纯 ASCII。上一版这里用的是中文长名
          # `PriceLens比价助手_vX.Y.Z_免费开源_作者莫.apk`，GitHub 把非 ASCII 全剥掉后
          # 变成 `PriceLens._vvX.Y.Z_._.apk`（v 还叠成了 vv），只能事后手工补传一枚干净命名的附件。
          # 这个名字是 `update.json` 的 apkUrls 与 `dist` 分支共同引用的键，
          # 不能靠"发版的人记得补"——补漏一次就是清单指向一个不存在的附件。
          NAME="PriceLens-${RELEASE_TAG#v}.apk"
          mv release-assets/app-release.apk "release-assets/$NAME"
          echo "release job 产物名：$NAME"
      
      - name: 发布 Release 资源
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          draft: false
          prerelease: ${{ github.event.release.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========== 依赖安全扫描 ==========
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 设置 JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      
      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v3
      
      # OWASP dependency-check 暂未引入：项目未配置 org.owasp.dependencycheck 插件，
      # dependencyCheckAnalyze 任务不存在，该步骤此前必定失败，已移除。
      # 后续如需启用：先在根 build.gradle.kts 应用插件，再恢复本步骤与报告上传。
      # 当前依赖漏洞告警由下方 npm audit 与 .github/dependabot.yml 兜底。
      - name: npm 审计
        run: |
          cd desktop
          npm audit --audit-level=high
        continue-on-error: true